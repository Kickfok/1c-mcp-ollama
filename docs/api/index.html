<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1C MCP Server - API</title>
  <link rel="icon" href="../assets/logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    :root { --accent: #6E56CF; --ink: #1B1F3B; --muted: #6B7194; --bg: #F7F8FC; }
    body { margin: 0; background: var(--bg); font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); }
    header { display: flex; align-items: center; gap: 14px; padding: 14px 24px; background: #fff;
             border-bottom: 1px solid #E3E6F2; }
    header img { width: 40px; height: 40px; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    header a { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 14px; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 24px 0; }
    @media (max-width: 640px) { header { flex-wrap: wrap; padding: 12px 16px; } header a { margin-left: 0; } }
  </style>
</head>
<body>
  <header>
    <img src="../assets/logo.svg" alt="">
    <div>
      <h1>1C MCP Server - HTTP-сервис mcp_APIBackend</h1>
      <p>JSON-RPC 2.0 по протоколу Model Context Protocol: инструменты чтения метаданных и данных базы 1С</p>
    </div>
    <a href="https://github.com/Kickfok/1c-mcp-ollama">Репозиторий</a>
  </header>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      docExpansion: "list",
      defaultModelsExpandDepth: 0,
      tryItOutEnabled: false
    });
  </script>
</body>
</html>
