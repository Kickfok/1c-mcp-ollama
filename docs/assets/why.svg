<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="584" viewBox="0 0 1200 584" role="img" aria-labelledby="t d">
  <title id="t">Зачем 1C MCP Ollama Bridge</title>
  <desc id="d">Зачем 1C MCP Ollama Bridge: восемь задач, как их решают сейчас и как с мостом. Цифру из базы просят у программиста или ждут отчет - Вопрос обычным языком: в форме 1С, ответ за минуту-две. Облачный ИИ: данные базы уходят во внешний сервис - Модель в Ollama: на вашем компьютере или сервере. Нейросеть видит больше, чем положено сотруднику - Сеанс пользователя: роли и ограничения RLS как в 1С. ИИ уверенно пересказывает и путает цифры - Таблица из базы целиком: модель пишет только вывод. Непонятно, в каких таблицах данные за период - data_profile: проверяет таблицы пачками за 15 секунд. Нужный отчет есть, но его надо найти и настроить - Готовые отчеты БСП: модель находит вариант и задает период. Журнал регистрации разбирают вручную - read_event_log: отбор по уровню, событию, пользователю. Доработка мешает обновлять типовую конфигурацию - Отдельное расширение: ни одного заимствованного объекта.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowY" cx="12%" cy="0%" r="60%">
      <stop offset="0" stop-color="#FFC21A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFC21A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="92%" cy="100%" r="60%">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="584" rx="18" fill="#0B0E1C"/>
  <rect width="1200" height="584" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="584" rx="18" fill="url(#glowY)"/>
  <rect width="1200" height="584" rx="18" fill="url(#glowV)"/>
<text x="40" y="52" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFC21A" letter-spacing="2.5">ЗАЧЕМ</text>
