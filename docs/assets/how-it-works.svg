  <text x="40" y="96" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="28" fill="#E9ECF8" font-weight="700">Вопрос из 1С <tspan fill="#6B7199">→</tspan> ответ с данными базы.</text>
  <text x="40" y="126" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="17" fill="#9AA1C9">Модель выбирает инструмент и пишет вывод. Данные читает 1С с правами пользователя.</text>
