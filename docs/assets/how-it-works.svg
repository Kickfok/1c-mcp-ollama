  <rect width="1200" height="582" rx="18" fill="url(#glowV)"/>
<text x="40" y="52" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFC21A" letter-spacing="2.5">КАК ЭТО РАБОТАЕТ</text>
