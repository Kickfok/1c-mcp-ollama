  <rect x="40" y="174" width="4" height="214" rx="2" fill="#FFC21A"/>
  <text x="64" y="194" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="21" fill="#E9ECF8" font-weight="800">База 1С</text>
  <text x="64" y="216" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFC21A">расширение MCP_Сервер</text>
  <text x="64" y="252" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#C9CEE8">Форма вопроса: ход выполнения</text>
  <text x="64" y="276" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#C9CEE8">и ответ с таблицей</text>
  <text x="64" y="300" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" fill="#C9CEE8">13 инструментов, только чтение</text>
