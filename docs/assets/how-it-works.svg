<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="582" viewBox="0 0 1200 582" role="img" aria-labelledby="t d">
  <title id="t">Как работает 1C MCP Ollama Bridge</title>
  <desc id="d">Как работает 1C MCP Ollama Bridge. 1: форма 1С отправляет оркестратору вопрос и токен пользователя. 2: оркестратор передает модели вопрос, инструменты и заметки администратора. 3: модель отвечает call_tool. 4: оркестратор просит форму выполнить инструмент. 5: форма выполняет его в сеансе пользователя, с ролями и RLS, и возвращает результат. 6: модель получает результат в сокращенном виде. 7: модель отвечает final и называет инструмент в ResultFrom. 8: форма выводит ответ и полную таблицу. Внешние MCP-клиенты подключаются к /hs/mcp с личным токеном.</desc>
