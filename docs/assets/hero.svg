  <text x="102" y="52" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#E9ECF8" font-weight="700" letter-spacing="2.5">1C MCP OLLAMA BRIDGE</text>
  <text x="102" y="71" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#FFC21A" letter-spacing="2.5">ЛОКАЛЬНЫЙ ИИ ДЛЯ 1С:ПРЕДПРИЯТИЯ</text>
  <text x="1152" y="60" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#6B7199" text-anchor="end" letter-spacing="2">MCP · OLLAMA · MIT</text>
  <text x="48" y="146" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="54" fill="#E9ECF8" font-weight="800">Спросите базу 1С <tspan fill="#FFC21A">обычным языком</tspan><tspan fill="#8B7CFF">.</tspan></text>
  <text x="48" y="190" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" fill="#CDD3EE" font-weight="500">Модель работает на вашей видеокарте и отвечает данными базы <tspan fill="#5EE0A0" font-weight="700">с правами того, кто спросил</tspan>.</text>
  <text x="48" y="226" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#9AA1C9">qwen2.5-coder:32b в Ollama · 13 инструментов 1С · форма прямо в базе · Cursor и Claude Desktop по MCP</text>
