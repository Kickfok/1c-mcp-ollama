<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="546" viewBox="0 0 1200 546" role="img" aria-labelledby="t d">
  <title id="t">1C MCP Ollama Bridge</title>
  <desc id="d">1C MCP Ollama Bridge: спросите базу 1С обычным языком. Модель qwen2.5-coder:32b работает в Ollama на вашей видеокарте и отвечает данными базы с правами пользователя. Пример реального прогона: вопрос об ошибках журнала регистрации, вызов read_event_log в сеансе пользователя, ответ за 46 секунд. 13 инструментов, ни один не меняет данные, контекст 4096 токенов, хватает 12 ГБ видеопамяти, облачные сервисы не нужны, лицензия MIT.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowY" cx="12%" cy="0%" r="60%">
      <stop offset="0" stop-color="#FFC21A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFC21A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="92%" cy="100%" r="60%">
      <stop offset="0" stop-color="#8B7CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="546" rx="18" fill="#0B0E1C"/>
  <rect width="1200" height="546" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="546" rx="18" fill="url(#glowY)"/>
  <rect width="1200" height="546" rx="18" fill="url(#glowV)"/>
